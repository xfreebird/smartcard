# Flatpak manifest for eSemnBun (GNOME; app ID keeps the codename md.moldsign.MoldSign) — LNX-13, LNX-15.
# Build from the repository root:
#
#   flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
#   flatpak-builder --user --install-deps-from=flathub --force-clean --install build-dir linux/flatpak/md.moldsign.MoldSign.yml
#   flatpak run md.moldsign.MoldSign
#   # single-file bundle (what scripts/package-linux.sh produces):
#   flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir linux/flatpak/md.moldsign.MoldSign.yml
#   flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo eSemnBun.flatpak md.moldsign.MoldSign
#
# The module source is the checkout itself: linux/ depends on ../swift/MoldSignKit by path, and nothing is
# fetched by SwiftPM (no remote packages), so the build runs offline like Flathub requires.
# Not built on the dev Mac (no Linux host, R-09): CI and a Linux machine are the first real builds.
id: md.moldsign.MoldSign
runtime: org.gnome.Platform
# GNOME 51 is based on freedesktop-sdk 26.08; bump runtime-version and the swift6 extension branch together.
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  # Flathub's Swift 6 toolchain (branch 26.08: Swift 6.4.1, swift.org amazonlinux2 build incl. the static stdlib)
  - org.freedesktop.Sdk.Extension.swift6
command: esemnbun-gnome

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Smart-card reader through the host pcscd: maps /run/pcscd/pcscd.comm (flatpak ≥ 1.3.2).
  - --socket=pcsc
  # TSA / OCSP / CRL (plain HTTP to tsp.pki.gov.md / *.pki.md) and the browser bridge listening on
  # 127.0.0.1:18480 / localhost.cts.md:18443 (loopback listeners need the host network namespace).
  - --share=network
  # PIN vault: libsecret → GNOME Keyring / any Secret Service.
  - --talk-name=org.freedesktop.secrets
  # Signed files are written next to the original; files picked through the document portal fall back
  # to ~/Documents/MoldSign. Everything else goes through the FileChooser / OpenURI portals.
  - --filesystem=xdg-documents
  # Background portal (RequestBackground, SetStatus → Quick Settings "Background Apps") needs no permission.
  # The bridge's TLS identity (vendor localhost.p12, D-03) ships as /app/share/moldsign/localhost.p12; an imported
  # copy in ~/.var/app/md.moldsign.MoldSign/data/moldsign/ ($XDG_DATA_HOME inside the sandbox) takes precedence.

build-options:
  append-path: /usr/lib/sdk/swift6/bin
  prepend-ld-library-path: /usr/lib/sdk/swift6/lib

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # pcsc-lite client library (libpcsclite.so.1) + headers for the core's CPCSC target. The GNOME runtime does
  # not ship it; the daemon is the host's (reached through --socket=pcsc), so pcscd itself is removed.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      # meson's default libdir on this SDK is lib64, which neither the link (-L/app/lib) nor the runtime loader
      # searches (first CI build: "cannot find -lpcsclite")
      - --libdir=lib
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dpolkit=false
    post-install:
      - rm -f /app/sbin/pcscd
      - rmdir /app/sbin || true
    cleanup:
      - /bin/pcsc-spy
      - /lib/libpcscspy.so*
      - /share/doc
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.2.tar.xz
        sha256: 60a08942d8c00a1d86a3bf4c64eddbf7a5569c7c54f6904e3f07801bb5316acd
        x-checker-data:
          type: anitya
          project-id: 2611
          url-template: https://pcsclite.apdu.fr/files/pcsc-lite-$version.tar.xz

  - name: sentry-native
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib/esemnbun
      - -DSENTRY_BACKEND=inproc
      - -DSENTRY_TRANSPORT=curl
      - -DSENTRY_BUILD_SHARED_LIBS=ON
      - -DSENTRY_BUILD_TESTS=OFF
      - -DSENTRY_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/getsentry/sentry-native/archive/refs/tags/0.17.5.tar.gz
        sha256: 7a537f5717684bd54a4d15a61d20f0e04de4f3aa73556687c7dd255a19b5874d

  - name: esemnbun-gnome
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - dist
          - linux/.build
          - swift/MoldSignKit/.build
          - android
          - windows
          - apple
          - re
    build-commands:
      # pcsc-lite lives in /app here, not /usr: point the C shim and the linker at it.
      - >-
        swift build --package-path linux -c release --static-swift-stdlib
        -Xcc -I/app/include/PCSC -Xcc -I/app/include -Xlinker -L/app/lib
      - mkdir -p linux/.build/sentry-native/install/lib
      - cp /app/lib/esemnbun/libsentry.so linux/.build/sentry-native/install/lib/
      - linux/packaging/install.sh / /app gui
