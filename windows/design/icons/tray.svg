<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tray glyph with the status dot (docs/10 §0.2b, UX-11). Source for scripts/make-icons.py, which recolors it per
  state and taskbar theme. Like GitHub's tray/menu-bar glyph: a solid disc (root `color`, monochrome) with the
  signature cut out of it (transparent, #signature in the mask), so the taskbar shows through. Only the dot (#dot)
  carries color (green: a card is connected; gray: none); the knockout ring (#knockout-hole) keeps it readable at 16 px.
  32-unit grid: 2 units = 1 px at 16 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" color="#FFFFFF">
  <defs>
    <mask id="knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#FFFFFF"/>
      <!-- the signature: a small "x", a looped stroke, the line it is written on -->
      <g id="signature" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 11.5l3.5 3.5M9.5 11.5L6 15"/>
        <path d="M12 16.5C12.5 11 14 6.5 16.5 7.2C18.6 7.8 15.6 14 15 16.4C14.6 18 18 12.5 19.6 13.2C20.6 13.6 20.2 15.4 22.6 14.6"/>
        <path d="M6 20.5H19"/>
      </g>
      <circle id="knockout-hole" cx="26" cy="26" r="7.5" fill="#000000"/>
    </mask>
  </defs>
  <circle id="glyph" cx="15" cy="15" r="13" fill="currentColor" mask="url(#knockout)"/>
  <circle id="dot" cx="26" cy="26" r="5.5" fill="#4ADE80"/>
</svg>
