org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 enables the integrated R8 resource optimizer by default. Keep the release
# policy explicit so the optimizer cannot silently regress when tooling changes.
android.r8.optimizedResourceShrinking=true
# Robolectric's 144 MB android-all jar can stall on a slow mirror; Gradle's default 30 s read
# timeout aborted every CI retry of that download.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000
