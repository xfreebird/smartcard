version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: bundler
    directory: /
    schedule: { interval: weekly }
    groups:
      release-tooling:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    groups:
      website:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    groups:
      android:
        patterns: ["*"]
    open-pull-requests-limit: 2
    ignore:
      # The SDK 34 framework jar matches robolectric.properties (sdk=34) on the JDK 17 test runtime.
      - dependency-name: "org.robolectric:android-all-instrumented"
  - package-ecosystem: nuget
    directory: /windows
    schedule: { interval: weekly }
    groups:
      windows:
        patterns: ["*"]
    open-pull-requests-limit: 2
