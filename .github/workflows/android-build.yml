# Signed artifacts and version reservation require explicit manual dispatch.
name: Android build + Play testing
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional positive integer at or above the next reserved Play version code
        type: string
        required: false
      upload_play:
        description: Upload the AAB artifact to Play (may be blocked by an active review)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-play-version-code
  cancel-in-progress: false
jobs:
  android:
    permissions:
      contents: write
    timeout-minutes: 35
    name: Android (APK + AAB, upload key)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle/verification-metadata.xml
            android/gradle/libs.versions.toml
            android/gradle/gradle-daemon-jvm.properties
            android/gradle/wrapper/gradle-wrapper.jar
      - name: Require selected Android toolchain and optimization policy
        run: |
          python3 scripts/ci/android_build_policy.py --verify-wrapper > "$RUNNER_TEMP/android-toolchain.json"
          cat "$RUNNER_TEMP/android-toolchain.json"
      - name: Select Android build number
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/reserve-android-version.sh
      - name: Validate Play credentials when uploading
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$PLAY_JSON" ]] || { echo '::error::Configure GOOGLE_PLAY_SERVICE_ACCOUNT_JSON before running release CI'; exit 1; }
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/package-android.sh
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esemnbun-android
          retention-days: 30
          path: |
            dist/android/*.apk
            dist/android/*.aab
            dist/android/optimization/
          if-no-files-found: error

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Upload Google Play artifact only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK || 'alpha' }}
        run: bundle exec fastlane android_artifact
