name: Android build + Play testing
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'fastlane/**'
      - 'scripts/package-android.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional positive integer at or above the next reserved Play version code
        type: string
        required: false
      upload_play:
        description: Upload the AAB artifact to Play (may be blocked by an active review)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-play-version-code
  cancel-in-progress: false
jobs:
  android:
    name: Android (APK + AAB, upload key)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Select Android build number
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags origin
          minimum_version_code=1793624666
          last_reserved_code="$(git tag -l 'android-play-vc-*' | sed -n 's/^android-play-vc-//p' | sort -n | tail -1)"
          if [[ -n "$last_reserved_code" && "$last_reserved_code" -gt "$minimum_version_code" ]]; then
            next_build_number=$((last_reserved_code + 1))
          else
            next_build_number=$((minimum_version_code + 1))
          fi
          build_number="${BUILD_NUMBER_INPUT:-$next_build_number}"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid build number'; exit 1; }
          (( build_number <= 2100000000 )) || { echo '::error::Build number exceeds Android versionCode limit'; exit 1; }
          if (( build_number < next_build_number )); then
            if [[ -n "$BUILD_NUMBER_INPUT" && "$(git rev-parse "refs/tags/android-play-vc-$build_number^{}" 2>/dev/null || true)" == "$GITHUB_SHA" ]]; then
              echo "Reusing version code $build_number reserved for this source commit"
            else
              echo '::error::Build number belongs to another source commit or is below the next Play version code'
              exit 1
            fi
          else
            # Reserve an existing commit through the refs API; pushing a new annotated tag
            # can require workflows permission when main advanced after checkout.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/android-play-vc-$build_number" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Validate Play credentials when uploading
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$PLAY_JSON" ]] || { echo '::error::Configure GOOGLE_PLAY_SERVICE_ACCOUNT_JSON before running release CI'; exit 1; }
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/package-android.sh
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-android
          path: |
            dist/android/*.apk
            dist/android/*.aab
          if-no-files-found: error

      - uses: ruby/setup-ruby@v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Upload Google Play artifact only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK || 'alpha' }}
        run: bundle exec fastlane android_artifact
