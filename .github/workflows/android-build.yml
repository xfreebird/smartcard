name: Android build + Play testing
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'fastlane/**'
      - 'scripts/package-android.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional positive integer higher than the previous store build (defaults to this workflow run number)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: android-build
  cancel-in-progress: false
jobs:
  android:
    name: Android (APK + AAB, upload key)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Select Android build number
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          build_number="${BUILD_NUMBER_INPUT:-$(date +%s)}"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid build number'; exit 1; }
          (( build_number <= 2100000000 )) || { echo '::error::Build number exceeds Android versionCode limit'; exit 1; }
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Validate build number and Play credentials
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid build number'; exit 1; }
          [[ -n "$PLAY_JSON" ]] || { echo '::error::Configure GOOGLE_PLAY_SERVICE_ACCOUNT_JSON before running release CI'; exit 1; }
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/package-android.sh
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-android
          path: |
            dist/android/*.apk
            dist/android/*.aab
          if-no-files-found: error

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Publish to Google Play internal and closed testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK || 'alpha' }}
        run: bundle exec fastlane android_testing
