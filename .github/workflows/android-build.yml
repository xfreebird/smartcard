name: Android build + Play draft
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Positive integer higher than the previous store build
        type: string
        required: true
      upload_play:
        description: Upload AAB as an internal-track draft (requires Play service-account secret)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-build
  cancel-in-progress: false
env:
  BUILD_NUMBER: ${{ inputs.build_number }}
jobs:
  android:
    name: Android (APK + AAB, upload key)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Validate build number and optional Play credentials
        env:
          UPLOAD_PLAY: ${{ inputs.upload_play }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid build number'; exit 1; }
          if [[ "$UPLOAD_PLAY" == true && -z "$PLAY_JSON" ]]; then
            echo '::error::Configure GOOGLE_PLAY_SERVICE_ACCOUNT_JSON before requesting Play upload'
            exit 1
          fi
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/package-android.sh
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-android
          path: |
            dist/android/*.apk
            dist/android/*.aab
          if-no-files-found: error

      - uses: ruby/setup-ruby@v1
        if: inputs.upload_play
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Upload internal draft to Google Play
        if: inputs.upload_play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android_internal
