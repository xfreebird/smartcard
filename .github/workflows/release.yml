# Installation artifacts for every platform (docs/11), always published as a GitHub Release:
#   tag `v*` push        → release named after the tag
#   "Run workflow"       → release v<MARKETING_VERSION> (or the `tag` input); created if missing, else its files are
#                          replaced. `only: macos` etc. rebuilds one platform and swaps just its files in.
# Platforms that failed are listed in the release notes; SHA256SUMS.txt always covers every file of the release.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8      App Store Connect API key (match, export, notarization)
#   MATCH_PASSWORD                              decrypts the match storage (github.com/xfreebird/fastlanecerts)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   upload key
#   Windows signing stays optional (windows/README.md "Signing"): without it the MSI/MSIX are unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: Build one platform only (tags always build everything)
        type: choice
        options: [all, macos, ios, android, linux, flatpak, windows]
        default: all
      build_number:
        description: Optional positive integer override (must exceed the last uploaded build)
        type: string
        required: false
      tag:
        description: Release tag (default v<MARKETING_VERSION> from the Xcode project)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  macos:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'macos' }}
    name: macOS app (DMG, Developer ID, notarized) + CLI
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - name: Developer ID identity (match, read-only, temporary keychain)
        run: bundle exec fastlane mac_signing
      - name: Build, sign, notarize
        env:
          MACOS_SIGN_IDENTITY: Developer ID Application
          MACOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.tar.gz
          if-no-files-found: error

  ios:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'ios' }}
    name: iOS app (TestFlight upload + App Store and ad hoc IPAs)
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # Integer build identity; a new workflow run increments it (retries keep the same build).
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      # one archive → App Store IPA (uploaded to TestFlight; returns without waiting for Apple's processing)
      # and an ad hoc IPA (match AdHoc profile: installs on the team's registered devices)
      - name: Archive, export, upload to TestFlight
        run: bundle exec fastlane ios_release
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-ios
          path: dist/ios/*.ipa
          if-no-files-found: error

  android:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'android' }}
    name: Android (APK + AAB, upload key)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/package-android.sh
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-android
          path: |
            dist/android/*.apk
            dist/android/*.aab
          if-no-files-found: error

  linux:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    name: Linux (CLI tarball, .deb, .rpm)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: System libraries + packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libpcsclite-dev libssl-dev \
            libadwaita-1-dev libgtk-4-dev libsecret-1-dev \
            dpkg-dev debhelper rpm binutils desktop-file-utils appstream cmake libcurl4-openssl-dev curl ca-certificates
      - name: Packages
        env:
          MOLDSIGN_PACKAGES: tar deb rpm
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-linux
          path: dist/linux/
          if-no-files-found: error

  flatpak:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'flatpak' }}
    name: Linux (Flatpak bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: flatpak-builder
        run: |
          sudo apt-get update
          # with recommends: flatpak-builder strips with the host's eu-strip (elfutils) and runs AppStream compose on
          # the host, which needs the SVG pixbuf loader (librsvg2-common) to read the app icon ("file-read-error")
          sudo apt-get install -y flatpak flatpak-builder elfutils librsvg2-common
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the bundle
        run: |
          VERSION=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' linux/data/md.moldsign.MoldSign.metainfo.xml | head -1)
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/build" linux/flatpak/md.moldsign.MoldSign.yml
          mkdir -p dist/linux
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/repo" "dist/linux/eSemnBun-$VERSION.flatpak" md.moldsign.MoldSign
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-flatpak
          path: dist/linux/*.flatpak
          if-no-files-found: error

  windows:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'windows' }}
    name: Windows (MSI, MSIX, winget manifests)
    runs-on: windows-latest
    env:
      # Optional code signing (windows/README.md "Signing"): unset = unsigned artifacts.
      MOLDSIGN_TS_ENDPOINT: ${{ secrets.MOLDSIGN_TS_ENDPOINT }}
      MOLDSIGN_TS_ACCOUNT: ${{ secrets.MOLDSIGN_TS_ACCOUNT }}
      MOLDSIGN_TS_PROFILE: ${{ secrets.MOLDSIGN_TS_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MOLDSIGN_MSIX_IDENTITY: ${{ vars.MOLDSIGN_MSIX_IDENTITY }}
      MOLDSIGN_MSIX_PUBLISHER: ${{ vars.MOLDSIGN_MSIX_PUBLISHER }}
      MOLDSIGN_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MOLDSIGN_MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: windows/global.json }
      - name: Azure Trusted Signing client (only when configured)
        if: env.MOLDSIGN_TS_ENDPOINT != ''
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory "$env:RUNNER_TEMP\ts" -ExcludeVersion -NonInteractive
          "MOLDSIGN_TS_DLIB=$env:RUNNER_TEMP\ts\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        run: windows/scripts/package-windows.ps1 -Platforms x64
      # Microsoft Store: upload the MSIX as a new submission (tags only: each upload needs a higher version).
      # Needs the Partner Center Entra app secrets (docs/11); skipped while they are missing.
      - name: Publish to the Microsoft Store
        if: false   # disabled until the first Store submission is done by hand and the MSSTORE_* secrets exist (PLAN WIN-10)
        uses: microsoft/setup-msstore-cli@v1
      - name: Submit the MSIX
        if: false   # disabled until the first Store submission is done by hand and the MSSTORE_* secrets exist (PLAN WIN-10)
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          $msix = Get-ChildItem dist/windows/*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId 9PDPR6RNT42S
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-windows
          path: |
            dist/windows/*.msi
            dist/windows/*.msix
            dist/windows/SHA256SUMS.txt
            dist/windows/winget/
          if-no-files-found: error

  release:
    name: GitHub Release
    # publish whatever was built, even when a platform failed (it is named in the notes and can be re-run alone)
    if: ${{ !cancelled() }}
    needs: [macos, ios, android, linux, flatpak, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "esemnbun-*" }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' apple/eSemnBun.xcodeproj/project.pbxproj | head -1)
            TAG="${INPUT_TAG:-v$VERSION}"
          fi
          mapfile -t FILES < <(find artifacts -type f \( -name '*.dmg' -o -name '*linux*.tar.gz' \
            -o -name '*.apk' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \
            -o -name '*.msi' \) | sort)
          if (( ${#FILES[@]} == 0 )); then echo "::error::nothing was built"; exit 1; fi
          FAILED=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$RESULTS" | paste -sd, - | sed 's/,/, /g')
          NOTE="Built by run ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}."
          [[ -n "$FAILED" ]] && NOTE="$NOTE Not built in this run: $FAILED (re-run the Release workflow with \`only\` set to add them)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "eSemnBun ${TAG#v}" --notes "$NOTE" --generate-notes "${FILES[@]}"
          fi
          # Remove store-upload packages and the standalone macOS CLI from public downloads.
          while IFS= read -r asset; do
            case "$asset" in
              *.ipa|*.aab|*.msix|*.pkg|*macos*.tar.gz) gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          # checksums over every installer now in the release (earlier runs included)
          mkdir -p all
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir all --clobber
          (cd all && rm -f SHA256SUMS.txt && sha256sum * > ../SHA256SUMS.txt)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS.txt
          {
            echo "### Release $TAG"
            echo "$NOTE"
            echo
            printf -- '- %s\n' "${FILES[@]##*/}"
          } >> "$GITHUB_STEP_SUMMARY"
