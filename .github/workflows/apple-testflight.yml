name: Apple TestFlight
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Apple platforms to upload
        type: choice
        options: [both, ios, macos]
        default: both
      build_number:
        description: Positive integer higher than the existing store build
        type: string
        required: true
permissions:
  contents: read
jobs:
  upload:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["ios","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: xcode-27
    concurrency:
      group: apple-store-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select iPhone Duo SDK
        if: matrix.platform == 'ios'
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          bash apple/scripts/require-ios-sdk.sh
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Require Siri system schemas
        run: bash apple/scripts/require-siri-sdk.sh
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Build and upload
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == ios ]]; then
            bundle exec fastlane ios_release upload:true
          else
            bundle exec fastlane mac_store_release upload:true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: apple-store-input-${{ matrix.platform }}-${{ github.run_id }}
          retention-days: 30
          path: |
            dist/ios/*.ipa
            dist/macos-app-store/*.pkg
          if-no-files-found: warn
