name: Huawei AppGallery draft upload
on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: Main Android build run containing the exact packaged APK to stage
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: huawei-appgallery-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publishing dependencies
        run: python -m pip install requests==2.32.5 cryptography==46.0.3
      - name: Validate publishing boundaries
        run: python -m unittest discover -s scripts -p test_appgallery.py
      - name: Download the selected completed main Android build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.android_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo '::error::A numeric Android run ID is required'; exit 1; }
          run_state="$(gh run view "$SOURCE_RUN" --json status,headBranch,workflowName --jq '[.status,.headBranch,.workflowName] | @tsv')"
          [[ "$run_state" == $'completed\tmain\tAndroid build + Play testing' ]] || {
            echo '::error::Selected run must be a completed Android build on main'; exit 1;
          }
          gh run download "$SOURCE_RUN" --name esemnbun-android --dir "$RUNNER_TEMP/appgallery"
          mapfile -t apks < <(find "$RUNNER_TEMP/appgallery" -type f -name '*.apk')
          [[ "${#apks[@]}" == 1 ]] || { echo '::error::Expected exactly one APK'; exit 1; }
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          badging="$($aapt_bin dump badging "${apks[0]}")"
          package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging")"
          [[ "$package" == md.esemnbun.app && "$version_code" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Unexpected APK identity'; exit 1; }
          echo "APK_PATH=${apks[0]}" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Source Android run: $SOURCE_RUN; version code: $version_code" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "${apks[0]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload latest APK as a draft
        env:
          HUAWEI_APPGALLERY_SERVICE_ACCOUNT_JSON: ${{ secrets.HUAWEI_APPGALLERY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/appgallery.py --apk "$APK_PATH" --version-code "$APK_VERSION_CODE" --draft --defer-if-reviewing
