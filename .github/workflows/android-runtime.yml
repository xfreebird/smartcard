name: Android x86-64 runtime smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle/verification-metadata.xml
            android/gradle/libs.versions.toml
            android/gradle/gradle-daemon-jvm.properties
            android/gradle/wrapper/gradle-wrapper.jar
      - name: Require selected Android toolchain and optimization policy
        run: |
          python3 scripts/ci/android_build_policy.py --verify-wrapper > "$RUNNER_TEMP/android-toolchain.json"
          cat "$RUNNER_TEMP/android-toolchain.json"
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build mock-capable APK
        working-directory: android
        run: ../scripts/gradle-ci.sh --no-daemon -Pkotlin.compiler.execution.strategy=in-process :core:test :app:assembleDebug
      - run: python3 scripts/check-android-abis.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release build memory before emulator startup
        run: |
          android/gradlew -p android --stop
          free -h
          nproc
      - name: Reserve disk space for the Android system image
        run: |
          # Disposable Android-only runner: .NET is not used by this job.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Phone and tablet mock runtime (no reader or PIN)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          # Native mock journeys do not need Google Play services or first-boot updates.
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          pre-emulator-launch-script: python3 scripts/ci/check-emulator-resources.py
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 scripts/ci/prepare-android-ui.py emulator-5554 "$RUNNER_TEMP/android-ui-boot"
            ADB="$ANDROID_HOME/platform-tools/adb" android/scripts/capture-screenshots.sh android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/esemnbun-phone" emulator-5554
            adb shell wm size 2560x1600
            adb shell wm density 240
            ADB="$ANDROID_HOME/platform-tools/adb" android/scripts/capture-screenshots.sh android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/esemnbun-tablet" emulator-5554
            adb shell wm size reset
            adb shell wm density reset
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-runtime-screenshots-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/android-ui-boot/
            ${{ runner.temp }}/android-toolchain.json
            ${{ runner.temp }}/esemnbun-phone/
            ${{ runner.temp }}/esemnbun-tablet/
          if-no-files-found: warn
