# Changed-platform validation only. Signing and publishing belong to explicit release workflows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  changes:
    timeout-minutes: 10
    name: Select affected platforms
    runs-on: ubuntu-latest
    outputs:
      localization: ${{ steps.select.outputs.localization }}
      swift: ${{ steps.select.outputs.swift }}
      macos: ${{ steps.select.outputs.macos }}
      ios: ${{ steps.select.outputs.ios }}
      linux: ${{ steps.select.outputs.linux }}
      android: ${{ steps.select.outputs.android }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - id: select
        run: python3 scripts/ci/select_jobs.py
      - name: Check workflow routing and publishing guards
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 -m unittest discover -s scripts -p test_play_publish.py
          python3 scripts/check-journey-coverage.py
  localization:
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.localization == 'true'
    name: Shared localization exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/localize.py --check --require-complete
      - run: python3 scripts/export-browser-services.py --check
      - run: python3 scripts/prepare-store-metadata.py --check

  swift-macos:
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift core + CLI (macOS, Apple + portable backends)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Test (Apple frameworks)
        working-directory: swift/MoldSignKit
        run: swift test
      - name: MCP stdio process contract
        run: python3 scripts/test-mcp-process.py swift/MoldSignKit/.build/debug/esemnbun-mcp
      - name: "Test (Linux code paths: OpenSSL + POSIX)"
        run: scripts/test-portable-macos.sh

  apple-apps:
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    name: macOS build, integration and mock UI
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - run: bash apple/scripts/require-siri-sdk.sh
      - name: Build mock-capable macOS app
        run: xcodebuild -project apple/eSemnBun.xcodeproj -scheme eSemnBun-macOS -configuration Debug -derivedDataPath "$RUNNER_TEMP/macos-build" CODE_SIGNING_ALLOWED=NO build
      - name: Application integration tests
        run: |
          swift build --package-path apple --target DesignSystem
          swift test --package-path apple
      - name: Native macOS mock UI journeys
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          bash scripts/ci/test-apple-ui.sh macos "$RUNNER_TEMP/macos-build/Build/Products/Debug/eSemnBun.app" "$RUNNER_TEMP/macos-ui"
      - name: macOS UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/macos-ui/**/*.xcresult
            ${{ runner.temp }}/macos-ui/**/test.log
          if-no-files-found: warn
      - name: macOS App Store variant (unsigned sandbox build)
        run: xcodebuild -project apple/eSemnBun.xcodeproj -scheme eSemnBun-macOS-AppStore CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project apple/eSemnBun.xcodeproj -scheme esemnbun-cli CODE_SIGN_IDENTITY=- build

  ios-app:
    timeout-minutes: 50
    # The Xcode 27 pool can service one Apple job at a time. Avoid expiring queued acquisitions.
    needs: [changes, apple-apps]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.ios == 'true' }}
    name: iOS build and iPhone + iPad mock UI
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 2
      - name: Require iPhone Duo SDK
        timeout-minutes: 2
        run: bash apple/scripts/require-ios-sdk.sh
      - name: Build iOS and share extension
        timeout-minutes: 5
        run: xcodebuild -project apple/eSemnBun.xcodeproj -scheme eSemnBun-iOS -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Native iPhone and iPad mock UI journeys
        # Both device families run concurrently on this runner. Leave room for evidence upload.
        timeout-minutes: 40
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          bash scripts/ci/test-apple-ui.sh ios "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/eSemnBun.app" "$RUNNER_TEMP/ios-ui"
      - name: iOS UI evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/ios-ui/**/*.xcresult
            ${{ runner.temp }}/ios-ui/**/test.log
            ${{ runner.temp }}/ios-ui/**/roundtrip.json
            ${{ runner.temp }}/ios-ui/*.json
            ${{ runner.temp }}/ios-ui/*.tsv
          if-no-files-found: warn

  linux:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    name: Linux (Swift core, CLI, GNOME app, packages)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2-noble
      # Avoid the intermittent hosted-container resolver failure for Ubuntu archives.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - uses: actions/checkout@v6
      - name: System libraries + packaging tools
        run: |
          apt-get -o Acquire::Retries=3 update --error-on=any
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends pkg-config libpcsclite-dev libssl-dev \
            libpoppler-glib-dev libadwaita-1-dev libgtk-4-dev libsecret-1-dev \
            dpkg-dev debhelper rpm binutils desktop-file-utils appstream \
            python3-pyatspi gir1.2-atspi-2.0 dbus-x11 xvfb xauth xdotool
      - name: Core + CLI tests
        working-directory: swift/MoldSignKit
        run: swift test
      - name: MCP stdio process contract
        run: python3 scripts/test-mcp-process.py swift/MoldSignKit/.build/debug/esemnbun-mcp
      - name: GNOME app (debug, includes the MSIGN_DEMO_CARDS demo mode)
        working-directory: linux
        run: swift build
      - name: GNOME application integration tests
        run: |
          python3 scripts/ci/check-linux-design-system.py
          swift test --package-path linux
      - name: Native GTK mock UI journeys
        env:
          GDK_BACKEND: x11
          GTK_A11Y: atspi
          NO_AT_BRIDGE: '0'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1440x1080x24" python3 linux/scripts/test-ui-journeys.py linux/.build/debug/esemnbun-gnome "$RUNNER_TEMP/linux-ui"
      - name: Linux UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ui/
          if-no-files-found: warn
      # Release builds (static Swift stdlib) of the CLI and the GNOME app, then the CLI tarball, .deb and .rpm
      # (LNX-07, LNX-15). The Flatpak bundle is skipped here: flatpak-builder needs a privileged container.
      - name: Packages
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-linux-${{ github.sha }}
          retention-days: 1
          path: dist/linux/
          if-no-files-found: error

  android:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android integration and mock UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Build and test Android (bounded dependency-download retries)
        run: scripts/gradle-ci.sh --no-daemon -Pkotlin.compiler.execution.strategy=in-process :core:test :transport-usb:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - run: python3 scripts/check-android-abis.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release build memory before emulator startup
        run: |
          android/gradlew -p android --stop
          free -h
          nproc
      - name: Reserve disk space for the Android system image
        run: |
          # Disposable Android-only runner: .NET is not used by this job.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Native Android mock UI journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # Native mock journeys do not need Google Play services or first-boot updates.
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          pre-emulator-launch-script: python3 scripts/ci/check-emulator-resources.py
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 scripts/ci/prepare-android-ui.py emulator-5554 "$RUNNER_TEMP/android-ui-boot"
            bash android/scripts/test-journeys.sh emulator-5554 android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/android-ui"
      - name: Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/android-ui/
            ${{ runner.temp }}/android-ui-boot/
            android/**/build/test-results/
          if-no-files-found: warn

  windows:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: Windows (C# core + CLI tests; eSemnBun MSI + MSIX)
    runs-on: windows-latest
    env:
      # Public package identity only; CI never receives signing or Store credentials.
      MOLDSIGN_MSIX_IDENTITY: ${{ vars.MOLDSIGN_MSIX_IDENTITY }}
      MOLDSIGN_MSIX_PUBLISHER: ${{ vars.MOLDSIGN_MSIX_PUBLISHER }}
      MOLDSIGN_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MOLDSIGN_MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: |
            windows/**/*.csproj
            windows/Directory.Build.props
            windows/global.json
      - working-directory: windows
        run: dotnet test MoldSign.Portable.slnf
      - name: Build mock-capable Windows app
        run: dotnet build windows/src/MoldSign.App -c Debug -p:Platform=x64
      - name: Native Windows verification UI journeys
        shell: powershell
        run: |
          $app = (Resolve-Path 'windows/src/MoldSign.App/bin/x64/Debug/net10.0-windows10.0.19041.0/eSemnBun.exe').Path
          & windows/scripts/test-verification-journeys.ps1 -App $app -Output "$env:RUNNER_TEMP/windows-ui-verification"
      - name: Native Windows mock workflow UI journeys
        shell: powershell
        run: |
          $app = (Resolve-Path 'windows/src/MoldSign.App/bin/x64/Debug/net10.0-windows10.0.19041.0/eSemnBun.exe').Path
          & windows/scripts/test-mock-workflows.ps1 -App $app -Output "$env:RUNNER_TEMP/windows-ui-workflows"
      - name: Native Windows first launch
        shell: powershell
        run: |
          $app = (Resolve-Path 'windows/src/MoldSign.App/bin/x64/Debug/net10.0-windows10.0.19041.0/eSemnBun.exe').Path
          & windows/scripts/test-first-launch.ps1 -App $app -Output "$env:RUNNER_TEMP/windows-ui-first-launch"
      - name: Native Windows demo persistence
        shell: powershell
        run: |
          $app = (Resolve-Path 'windows/src/MoldSign.App/bin/x64/Debug/net10.0-windows10.0.19041.0/eSemnBun.exe').Path
          & windows/scripts/test-demo-mode.ps1 -App $app -Output "$env:RUNNER_TEMP/windows-ui-demo"
      - name: Native Windows card scrolling
        shell: powershell
        run: |
          $app = (Resolve-Path 'windows/src/MoldSign.App/bin/x64/Debug/net10.0-windows10.0.19041.0/eSemnBun.exe').Path
          & windows/scripts/test-card-page-scroll.ps1 -App $app -Output "$env:RUNNER_TEMP/windows-ui-card"
      - name: Native Windows reader helper lifecycle
        shell: powershell
        run: |
          dotnet build windows/src/MoldSign.Watcher -c Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = (Resolve-Path 'windows/src/MoldSign.App/bin/x64/Debug/net10.0-windows10.0.19041.0/eSemnBun.exe').Path
          $helper = (Resolve-Path 'windows/src/MoldSign.Watcher/bin/Debug/net10.0-windows/eSemnBun.Watcher.exe').Path
          & windows/scripts/test-insertion-helper.ps1 -App $app -Helper $helper -Output "$env:RUNNER_TEMP/windows-ui-helper"
      - name: Windows UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/windows-ui-*/
          if-no-files-found: warn
      - name: Package (Native AOT CLI, WinUI app, MSI, MSIX, winget manifests)
        shell: pwsh
        run: windows/scripts/package-windows.ps1 -Platforms x64
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-windows-x64
          retention-days: 1
          path: |
            dist/windows/*.msi
            dist/windows/*.msix
            dist/windows/SHA256SUMS.txt
            dist/windows/winget/
          if-no-files-found: error

  result:
    name: CI result
    if: always()
    needs: [changes, localization, swift-macos, apple-apps, ios-app, linux, android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          checks=json.loads(os.environ['RESULTS'])
          failed=[name for name,value in checks.items() if value['result'] not in ('success','skipped')]
          assert not failed, f'Failed or cancelled checks: {failed}'
          assert checks['changes']['result']=='success', 'Platform selection must succeed'
          print('All selected platform checks passed; unaffected platforms were skipped.')
          PYCODE
