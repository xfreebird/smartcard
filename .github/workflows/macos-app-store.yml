name: macOS App Store + TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Required positive integer higher than every uploaded macOS build
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 60
    runs-on: xcode-27
    concurrency:
      group: apple-store-macos
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash apple/scripts/require-siri-sdk.sh
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - name: Archive, export and upload to TestFlight
        run: bundle exec fastlane mac_store_release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esemnbun-macos-app-store
          retention-days: 30
          path: dist/macos-app-store/*.pkg
          if-no-files-found: error
