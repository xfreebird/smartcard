name: macOS App Store + TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional positive integer override (must exceed the last uploaded build)
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - run: bash apple/scripts/require-siri-sdk.sh
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - name: Archive, export and upload to TestFlight
        run: bundle exec fastlane mac_store_release
      - uses: actions/upload-artifact@v4
        with:
          name: esemnbun-macos-app-store
          path: dist/macos-app-store/*.pkg
          if-no-files-found: error
