name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate stable desktop update manifests
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          python3 website/scripts/generate-update-manifests.py --version "$version"
      - run: npm ci
        working-directory: website
      - run: node --test tests/*.test.mjs
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm run verify:seo
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/pages
  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOYMENT == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
