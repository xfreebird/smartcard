name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/docs/**', 'docs/user-guide/content/**', 'spec/mcp.md', 'spec/cli.md', 'scripts/packages/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'scripts/docs/**', 'docs/user-guide/content/**', 'spec/mcp.md', 'spec/cli.md', 'scripts/packages/**', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner, or an owner-started temporary recovery runner
        type: choice
        options: [ubuntu-latest, esemnbun-recovery]
        default: ubuntu-latest
  workflow_run:
    workflows: [Release, CLI package repositories]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && 'ignored' || 'deploy' }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      SITE_URL: https://esemnbun.md
      BASE_URL: /
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: inputs.runner != 'esemnbun-recovery'
        with:
          python-version: '3.12'
      - name: Use owner-managed recovery Python
        if: inputs.runner == 'esemnbun-recovery'
        run: echo "$(dirname "$(uv python find 3.12)")" >> "$GITHUB_PATH"
      - name: Check Python version
        run: python3 -c 'import sys; assert sys.version_info >= (3, 12)'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate release downloads and desktop update manifests
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/esemnbun-release.json"
          version=$(jq -r .tag_name "$RUNNER_TEMP/esemnbun-release.json")
          python3 website/scripts/generate-downloads.py "$RUNNER_TEMP/esemnbun-release.json" --public-dir "$RUNNER_TEMP/esemnbun-release-downloads"
          python3 website/scripts/generate-update-manifests.py --version "$version" --release-data website/src/data/release.json
          python3 scripts/packages/fetch-site-repositories.py "$RUNNER_TEMP/esemnbun-release.json" --destination "$RUNNER_TEMP/esemnbun-packages"
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: node --test tests/*.test.mjs
        working-directory: website
      - name: Check guide organization
        run: python3 scripts/docs/organize-user-guides.py --check
      - name: Validate illustrated user guides
        run: python3 scripts/docs/validate-user-guides.py
      - run: npm run build
        working-directory: website
      - name: Stage downloads once for all website languages
        if: github.event_name != 'pull_request'
        run: |
          mv "$RUNNER_TEMP/esemnbun-release-downloads" website/pages/release-downloads
          if [ -d "$RUNNER_TEMP/esemnbun-packages" ]; then
            mv "$RUNNER_TEMP/esemnbun-packages" website/pages/packages
          fi
      - run: npm run verify:seo
        working-directory: website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/pages
  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOYMENT == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
