<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title description">
<title id="title">eSemnBun layered component architecture</title>
<desc id="description">Presentation calls application services, which coordinate card and document core logic through platform adapters. External systems are the reader and ID card, operating-system storage and remote PKI services. The private signing key remains on the ID card.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3459a6"/></marker></defs>
<rect width="1000" height="1040" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
