e="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="674" dy="0">HTTP · sockets · loopback TLS</tspan></text><path d="M500,778 L500,806" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="810" width="936" height="140" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="52" y="839" font-size="15" fill="#172554" text-anchor="start" font-weight="700"><tspan x="52" dy="0">05  OUTSIDE THE APPLICATION</tspan></text><rect x="48" y="855" width="292" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="62" y="883" font-size="18" fill="#172554" text-anchor="start" font-weight="650"><tspan x="62" dy="0">Reader and ID card</tspan></text><text x="62" y="910" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="62" dy="0">Private signing key stays here</tspan></text><rect x="354" y="855" width="292" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="368" y="883" font-size="18" fill="#172554" text-anchor="start" font-weight="650"><tspan x="368" dy="0">Operating system</tspan></text><text x="368" y="910" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="368" dy="0">Documents · credential store</tspan></text><rect x="660" y="855" width="292" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="674" y="883" font-size="18" fill="#172554" text-anchor="start" font-weight="650"><tspan x="674" dy="0">PKI services</tspan></text><text x="674" y="910" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="674" dy="0">Timestamp · revocation data</tspan></text><text x="32" y="986" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">Arrows: calls / data flow across responsibilities. Most layers share one process.</tspan></text><text x="32" y="1013" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">Swift on Apple/Linux · Kotlin on Android · C# on Windows · common byte vectors</tspan></text>
