<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1335" viewBox="0 0 1000 1335" role="img" aria-labelledby="title description">
<title id="title">eSemnBun identity-card signing sequence</title>
<desc id="description">The person chooses a document and approves. The service authenticates a card session, reads and compares the certificate, verifies the PIN over secure messaging, and asks the card to sign DigestInfo. A mismatch or PIN failure stops signing. The service obtains a timestamp when required and saves PDF or XML output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3459a6"/></marker></defs>
<rect width="1000" height="1335" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<text x="32" y="44" font-size="28" fill="#172554" text-anchor="start" font-weight="700"><tspan x="32" dy="0">From approval to a signed document</tspan></text><text x="32" y="77" font-size="17" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">Logical signing sequence · replies dashed · card arrows pass through the reader</tspan></text><rect x="18" y="105" width="224" height="70" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="130" y="135" font-size="17" fill="#172554" text-anchor="middle" font-weight="650"><tspan x="130" dy="0">Person / native UI</tspan></text><path d="M130,175 V1240" stroke="#94a3b8" stroke-dasharray="5 6"/><rect x="263" y="105" width="224" height="70" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="375" y="135" font-size="17" fill="#172554" text-anchor="middle" font-weight="650"><tspan x="375" dy="0">Signing service</tspan><tspan x="375" dy="25">and format core</tspan></text><path d="M375,175 V1240" stroke="#94a3b8" stroke-dasharray="5 6"/><rect x="508" y="105" width="224" height="70" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="620" y="135" font-size="17" fill="#172554" text-anchor="middle" font-weight="650"><tspan x="620" dy="0">Reader / ID card</tspan></text><path d="M620,175 V1240" stroke="#94a3b8" stroke-dasharray="5 6"/><rect x="753" y="105" width="224" height="70" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="865" y="135" font-size="17" fill="#172554" text-anchor="middle" font-weight="650"><tspan x="865" dy="0">Timestamp authority</tspan></text><path d="M865,175 V1240" stroke="#94a3b8" stroke-dasharray="5 6"/><rect x="20" y="195" width="960" height="34" rx="6" fill="#e2e8f0" stroke="#e2e8f0"/><text x="34" y="218" font-size="16" fill="#172554" text-anchor="start" font-weight="650"><tspan x="34" dy="0">1  Freeze input and obtain consent</tspan></text><text x="252.5" y="251" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="252.5" dy="0">Choose document / identity</tspan><tspan x="252.5" dy="25">Approve the signing request</tspan></text><path d="M130,290 L375,290" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="315" width="960" height="34" rx="6" fill="#e2e8f0" stroke="#e2e8f0"/><text x="34" y="338" font-size="16" fill="#172554" text-anchor="start" font-weight="650"><tspan x="34" dy="0">2  Establish the protected card session</tspan></text><text x="497.5" y="371" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">Select application</tspan><tspan x="497.5" dy="25">Read initialization data</tspan></text><path d="M375,410 L620,410" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="497.5" y="431" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">Challenge + mutual auth</tspan><tspan x="497.5" dy="25">Derive session keys / SSC</tspan></text><path d="M375,470 L620,470" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="497.5" y="506" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">Authentication response</tspan></text><path d="M620,520 L375,520" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="20" y="535" width="960" height="34" rx="6" fill="#dcfce7" stroke="#dcfce7"/><text x="34" y="558" font-size="16" fill="#172554" text-anchor="start" font-weight="650"><tspan x="34" dy="0">3  Check identity before sending the PIN</tspan></text><text x="497.5" y="586" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">Read signing certificate</tspan><tspan x="497.5" dy="25">through secure messaging</tspan></text><path d="M375,625 L620,625" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="497.5" y="666" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">Certificate bytes</tspan></text><path d="M620,680 L375,680" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="230" y="700" width="290" height="58" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="375" y="725" font-size="15" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="375" dy="0">Compare with approved identity</tspan><tspan x="375" dy="25">Mismatch: stop before VERIFY</tspan></text><rect x="20" y="780" width="960" height="34" rx="6" fill="#e2e8f0" stroke="#e2e8f0"/><text x="34" y="803" font-size="16" fill="#172554" text-anchor="start" font-weight="650"><tspan x="34" dy="0">4  Authorize and sign inside the card</tspan></text><text x="497.5" y="836" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">Protected VERIFY PIN</tspan><tspan x="497.5" dy="25">Wrong / blocked PIN: stop</tspan></text><path d="M375,875 L620,875" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="497.5" y="896" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">Set signing environment</tspan><tspan x="497.5" dy="25">Sign encoded DigestInfo</tspan></text><path d="M375,935 L620,935" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="497.5" y="976" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="497.5" dy="0">RSA signature bytes</tspan></text><path d="M620,990 L375,990" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="20" y="1010" width="960" height="34" rx="6" fill="#e2e8f0" stroke="#e2e8f0"/><text x="34" y="1033" font-size="16" fill="#172554" text-anchor="start" font-weight="650"><tspan x="34" dy="0">5  Add timestamp when required, assemble and save</tspan></text><text x="620.0" y="1076" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="620.0" dy="0">RFC 3161 request over signature digest</tspan></text><path d="M375,1090 L865,1090" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="620.0" y="1126" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="620.0" dy="0">Timestamp token</tspan></text><path d="M865,1140 L375,1140" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="252.5" y="1176" font-size="16" fill="#172554" text-anchor="middle" font-weight="400"><tspan x="252.5" dy="0">Assemble PDF / XML</tspan><tspan x="252.5" dy="25">Save and report result</tspan></text><path d="M375,1215 L130,1215" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="32" y="1280" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">The card receives an encoded digest, not the whole document. Its private key never leaves it.</tspan></text><text x="32" y="1307" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">Certificate discovery may use an earlier session; the signing path rechecks the selected identity.</tspan></text>
</g></svg>
