<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1075" viewBox="0 0 1000 1075" role="img" aria-labelledby="title description">
<title id="title">eSemnBun release pipeline</title>
<desc id="description">A prepared commit on main feeds three lanes. Downloads: the Release workflow reserves the tag, builds the desktop platforms and publishes the GitHub Release with an optional Microsoft Store submission; Windows files are then Certum-signed, and the CLI package repositories and website follow. Apple: TestFlight upload, processing, then the App Review workflow submits the build. Android: one signed build is published to Google Play and staged on Huawei AppGallery, and its APK is attached to the GitHub Release. Every lane ends with verification and a recorded report.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3459a6"/></marker></defs>
<rect width="1000" height="1075" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<text x="32" y="44" font-size="28" fill="#172554" text-anchor="start" font-weight="700"><tspan x="32" dy="0">eSemnBun · release pipeline</tspan></text><text x="32" y="77" font-size="18" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">From one prepared commit to downloads and five stores</tspan></text><rect x="32" y="100" width="936" height="70" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="46" y="128" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="46" dy="0">Prepare on main</tspan></text><text x="46" y="153" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Marketing version on every platform · EN/RO/RU notes in the catalog · store exports · CI result passes</tspan></text><text x="180" y="212" font-size="16" fill="#172554" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Downloads · Microsoft Store</tspan></text><path d="M180,172 L180,194" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="228" width="296" height="96" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="46" y="256" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="46" dy="0">release.yml</tspan></text><text x="46" y="281" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Tag job first, then macOS, Linux,</tspan><tspan x="46" dy="25">Flatpak and Windows builds</tspan></text><path d="M180,326 L180,354" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="356" width="296" height="96" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="46" y="384" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="46" dy="0">GitHub Release</tspan></text><text x="46" y="409" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Assets and SHA256SUMS.txt;</tspan><tspan x="46" dy="25">optional Microsoft Store submission</tspan></text><path d="M180,454 L180,482" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="484" width="296" height="96" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="46" y="512" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="46" dy="0">Certum signing</tspan></text><text x="46" y="537" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="46" dy="0">MSI and CLI signed on an approved</tspan><tspan x="46" dy="25">Mac; assets and checksums replaced</tspan></text><path d="M180,582 L180,610" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="612" width="296" height="96" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="46" y="640" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="46" dy="0">CLI package repositories</tspan></text><text x="46" y="665" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="46" dy="0">APT/RPM, Scoop, Homebrew and</tspan><tspan x="46" dy="25">Chocolatey from the signed CLI</tspan></text><path d="M180,710 L180,738" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="740" width="296" height="96" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="46" y="768" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="46" dy="0">Website</tspan></text><text x="46" y="793" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Downloads and update feeds</tspan><tspan x="46" dy="25">from the latest release</tspan></text><path d="M180,838 L180,864" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="212" font-size="16" fill="#172554" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">App Store · Mac App Store</tspan></text><path d="M500,172 L500,194" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="352" y="228" width="296" height="96" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="366" y="256" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="366" dy="0">apple-testflight.yml</tspan></text><text x="366" y="281" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="366" dy="0">iOS IPA and Mac App Store PKG</tspan><tspan x="366" dy="25">uploaded to TestFlight</tspan></text><path d="M500,326 L500,354" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="352" y="356" width="296" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="366" y="384" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="366" dy="0">App Store Connect</tspan></text><text x="366" y="409" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="366" dy="0">Processes the build until VALID,</tspan><tspan x="366" dy="25">export compliance answered</tspan></text><path d="M500,454 L500,482" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="352" y="484" width="296" height="96" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="366" y="512" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="366" dy="0">apple-app-review.yml</tspan></text><text x="366" y="537" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="366" dy="0">status, then submit: What&#x27;s New,</tspan><tspan x="366" dy="25">build attached, review submitted</tspan></text><path d="M500,582 L500,610" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="352" y="612" width="296" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="366" y="640" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="366" dy="0">App Review</tspan></text><text x="366" y="665" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="366" dy="0">Waiting, in review, approved;</tspan><tspan x="366" dy="25">release type decides go-live</tspan></text><path d="M500,710 L500,864" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><text x="820" y="212" font-size="16" fill="#172554" text-anchor="middle" font-weight="700"><tspan x="820" dy="0">Google Play · Huawei AppGallery</tspan></text><path d="M820,172 L820,194" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="672" y="228" width="296" height="96" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="686" y="256" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="686" dy="0">android-build.yml</tspan></text><text x="686" y="281" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="686" dy="0">Reserves a version code; signed</tspan><tspan x="686" dy="25">APK and AAB as one artifact</tspan></text><path d="M820,326 L820,354" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="672" y="356" width="296" height="96" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="686" y="384" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="686" dy="0">android-play-publish.yml</tspan></text><text x="686" y="409" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="686" dy="0">artifact_only, closed_testing or</tspan><tspan x="686" dy="25">production (expected_version)</tspan></text><path d="M820,454 L820,482" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="672" y="484" width="296" height="96" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="686" y="512" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="686" dy="0">huawei-appgallery.yml</tspan></text><text x="686" y="537" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="686" dy="0">Draft from the same APK; submit</tspan><tspan x="686" dy="25">with scripts/appgallery.py</tspan></text><path d="M820,582 L820,610" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="672" y="612" width="296" height="96" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="686" y="640" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="686" dy="0">APK on the GitHub Release</tspan></text><text x="686" y="665" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="686" dy="0">The same APK attached;</tspan><tspan x="686" dy="25">SHA256SUMS.txt regenerated</tspan></text><path d="M820,710 L820,864" fill="none" stroke="#3459a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="866" width="936" height="70" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="46" y="894" font-size="17" fill="#172554" text-anchor="start" font-weight="650"><tspan x="46" dy="0">Verify and record</tspan></text><text x="46" y="919" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Hashes and signatures checked · store states read back · report under docs/reports · PLAN.md entry</tspan></text><rect x="32" y="958" width="22" height="22" rx="5" fill="#eef2ff" stroke="#cbd5e1"/><text x="64" y="975" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="64" dy="0">Manual dispatch</tspan></text><rect x="268" y="958" width="22" height="22" rx="5" fill="#ecfdf5" stroke="#cbd5e1"/><text x="300" y="975" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="300" dy="0">Runs automatically</tspan></text><rect x="504" y="958" width="22" height="22" rx="5" fill="#fff7ed" stroke="#cbd5e1"/><text x="536" y="975" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="536" dy="0">Owner step outside Actions</tspan></text><rect x="740" y="958" width="22" height="22" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="772" y="975" font-size="15" fill="#334155" text-anchor="start" font-weight="400"><tspan x="772" dy="0">Store processing</tspan></text><text x="32" y="1018" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">CLI feeds and the website also run automatically after every successful Release.</tspan></text><text x="32" y="1045" font-size="16" fill="#475569" text-anchor="start" font-weight="400"><tspan x="32" dy="0">Upload, review submission, approval and availability are separate outcomes.</tspan></text>
</g></svg>
