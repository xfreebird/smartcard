<svg xmlns="http://www.w3.org/2000/svg" width="960" height="263" viewBox="0 0 960 263"><rect width="960" height="263" rx="18" fill="#101b2c"/><circle cx="26" cy="26" r="6" fill="#ef7878"/><circle cx="46" cy="26" r="6" fill="#edc56a"/><circle cx="66" cy="26" r="6" fill="#6bc999"/><text x="95" y="32" font-family="sans-serif" font-size="18" fill="#b9c7dc">macos-cli · Exemplu de comandă</text><text x="120" y="80" xml:space="preserve" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="19" fill="#9ce0bc">$ esemnbun-mcp \</text><text x="120" y="108" xml:space="preserve" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="19" fill="#e3ebf8">    --root documents=/Users/me/Documents/Signing \</text><text x="120" y="136" xml:space="preserve" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="19" fill="#e3ebf8">    --allow-unattended-signing \</text><text x="120" y="164" xml:space="preserve" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="19" fill="#e3ebf8">    --signing-certificate-sha256 &lt;CERTIFICATE_SHA256&gt; \</text><text x="120" y="192" xml:space="preserve" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="19" fill="#e3ebf8">    --signing-output-directory /Users/me/PrivateOutput \</text><text x="120" y="220" xml:space="preserve" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="19" fill="#e3ebf8">    --pin-source keychain:service:account</text></svg>