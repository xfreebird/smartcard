# Analysis scope for the CI scanner in .github/workflows/sonar-coverage.yml (automatic analysis is off).
# Only shipped runtime code is analyzed: the native apps and their extensions and helpers, the shared Swift core
# with its CLI and MCP server, the Windows projects and the website's pages. Tests, fixtures, build, CI, release
# and documentation scripts, packaging tools and debug-only Android sources are outside the scope.
sonar.inclusions=swift/MoldSignKit/Sources/**,apple/Apps/**,apple/Helpers/**,apple/ShareExtension/**,apple/WidgetExtension/**,linux/Sources/**,android/core/src/main/**,android/transport-usb/src/main/**,android/app/src/main/**,android/app/src/release/**,windows/src/**,website/src/**
# A capability probe run only by the test suites, and build output inside the included folders.
sonar.exclusions=swift/MoldSignKit/Sources/MoldSignKit/FileProtection/DecipherCapabilityProbe.swift,**/build/**,**/bin/**,**/obj/**,**/node_modules/**,**/.build/**,**/.build-portable/**
# Test projects the .NET scanner detects are not analyzed either.
sonar.test.exclusions=**/*
sonar.sourceEncoding=UTF-8
